<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Translation Settings</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #0066cc;
            text-align: center;
        }
        .setting-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .button {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .save-button {
            background: #0066cc;
            color: white;
        }
        .save-button:hover {
            background: #0052a3;
        }
        .export-button {
            background: #28a745;
            color: white;
        }
        .export-button:hover {
            background: #218838;
        }
        .import-button {
            background: #ffc107;
            color: #212529;
        }
        .import-button:hover {
            background: #e0a800;
        }
        .status {
            margin-top: 16px;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .vocabulary-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .vocabulary-info h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Peak Translation Settings</h1>
    
    <div class="setting-group">
        <label for="native-language">Native Language (translations will be shown in this language)</label>
        <select id="native-language">
            <option value="tr">Turkish</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>
    </div>
    
    <div class="setting-group">
        <label for="learning-language">Language You're Learning</label>
        <select id="learning-language">
            <option value="en">English</option>
            <option value="tr">Turkish</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>
    </div>
    
    <div class="button-group">
        <button class="button save-button" id="save-settings">Save Settings</button>
        <button class="button export-button" id="export-vocab">Export Vocabulary</button>
        <button class="button import-button" id="import-vocab">Import Vocabulary</button>
    </div>
    
    <div class="vocabulary-info" id="vocab-info">
        <h2>Vocabulary</h2>
        <p id="vocab-count">Loading...</p>
    </div>
    
    <div class="status" id="status"></div>

    <script src="options.js"></script>
</body>
</html>
