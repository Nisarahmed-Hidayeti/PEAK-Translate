<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Translation Options</title>
    <link rel="stylesheet" href="/options/options.css">
</head>
<body>
    <div class="options-container">
        <h1>Peak Translation Options</h1>
        <form id="options-form">
            <div class="option-group">
                <label for="native-language">Native Language:</label>
                <select id="native-language">
                    <option value="tr">Turkish</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="option-group">
                <label for="learning-language">Learning Language:</label>
                <select id="learning-language">
                    <option value="tr">Turkish</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="option-group">
                <label for="audio-enabled">Enable Audio Pronunciation:</label>
                <input type="checkbox" id="audio-enabled">
            </div>
            <div class="option-group">
                <label for="ocr-language">OCR Language Preference:</label>
                <select id="ocr-language">
                    <option value="auto">Auto-detect</option>
                    <option value="tr">Turkish</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <button type="submit" id="save-options">Save Options</button>
        </form>
        <div id="vocabulary-section">
            <h2>Saved Vocabulary</h2>
            <button id="clear-vocabulary">Clear Vocabulary</button>
            <ul id="vocabulary-list"></ul>
        </div>
    </div>
    <script src="/options/options.js" type="module"></script>
</body>
</html>
