<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Translation</title>
    <link rel="stylesheet" href="/popup/popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="popup-header">
            <h1>Peak Translation</h1>
        </div>
        <div class="popup-content">
            <div class="translation-section">
                <label for="source-lang">From:</label>
                <select id="source-lang">
                    <option value="auto">Auto-detect</option>
                    <option value="tr">Turkish</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="translation-section">
                <label for="target-lang">To:</label>
                <select id="target-lang">
                    <option value="tr">Turkish</option>
                    <option value="en" selected>English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="translation-section">
                <textarea id="input-text" placeholder="Enter text to translate..."></textarea>
            </div>
            <button id="translate-btn">Translate</button>
            <div id="translation-result" class="translation-result">
                <p id="translated-text"></p>
            </div>
        </div>
        <div class="popup-footer">
            <button id="options-btn">Options</button>
        </div>
    </div>
    <script src="/popup/popup.js" type="module"></script>
</body>
</html>
